[package]
name = "portman"
version = "0.1.0"
edition = "2024"
description = "Know what's running on your machine."
license = "MIT"
repository = "https://github.com/zalaya/Portman"
readme = "README.md"
keywords = ["tui", "network", "ports", "process", "cli"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
arboard = "3.4"
crossterm = "0.29.0"
netstat2 = "0.11.2"
ratatui = "0.30.2"
sysinfo = "0.39.6"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "filtering"
harness = false
